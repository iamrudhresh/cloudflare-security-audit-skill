name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validators:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Runs every *.test.cjs suite, so a newly added validator cannot ship
      # without its tests running on all three platforms.
      - name: Run all validator test suites
        run: node --test
        working-directory: skills/security-audit

  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed conflict markers
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- . ; then
            echo "conflict markers found" >&2
            exit 1
          fi
